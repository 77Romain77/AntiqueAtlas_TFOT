apply from: "${_loader}.gradle".toLowerCase()

println('Java: ' + System.getProperty('java.version'))
println('JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
println('Mod Name: ' + _mod_name + ', Mod Version: ' + _mod_version + ', Minecraft Version: ' + _minecraft_version + ', '+"${_loader} Version: " + _loader_version)

version = _minecraft_version + "-" +_mod_version +"-${_loader}"
group = modGroup
base {
    archivesName = _mod_name
}

def shaderSafeSourceRoot = file('src/main/resources/assets/antiqueatlas/textures/gui')
def generatedShaderSafeResources = layout.buildDirectory.dir('generated/shader-safe-resources')

def generateShaderSafeTextures = tasks.register('generateShaderSafeTextures') {
    def tileSources = fileTree(new File(shaderSafeSourceRoot, 'tiles')) {
        include '*.png'
    }
    def frameSource = new File(shaderSafeSourceRoot, 'book_frame.png')

    inputs.files(tileSources)
    inputs.file(frameSource)
    outputs.dir(generatedShaderSafeResources)

    doLast {
        File outputRoot = generatedShaderSafeResources.get().asFile
        project.delete(outputRoot)

        def writeShaderSafeTexture = { File source, File target, boolean compositeOnParchment ->
            def input = javax.imageio.ImageIO.read(source)
            if (input == null) {
                throw new GradleException("Could not decode shader-safe texture source: ${source}")
            }

            def output = new java.awt.image.BufferedImage(
                    input.width, input.height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < input.height; y++) {
                for (int x = 0; x < input.width; x++) {
                    int argb = input.getRGB(x, y)
                    int alpha = (argb >>> 24) & 0xFF
                    if (alpha == 0) {
                        output.setRGB(x, y, argb & 0x00FFFFFF)
                        continue
                    }

                    int red = (argb >>> 16) & 0xFF
                    int green = (argb >>> 8) & 0xFF
                    int blue = argb & 0xFF
                    if (compositeOnParchment) {
                        // Matches the shader-patch resource pack: blend the ink
                        // onto Antique Atlas' parchment colour before making it opaque.
                        red = (red * alpha + 225 * (255 - alpha) + 127).intdiv(255)
                        green = (green * alpha + 188 * (255 - alpha) + 127).intdiv(255)
                        blue = (blue * alpha + 129 * (255 - alpha) + 127).intdiv(255)
                    }

                    output.setRGB(x, y, (255 << 24) | (red << 16) | (green << 8) | blue)
                }
            }

            target.parentFile.mkdirs()
            if (!javax.imageio.ImageIO.write(output, 'png', target)) {
                throw new GradleException("Could not encode shader-safe texture: ${target}")
            }
        }

        tileSources.files.each { File source ->
            writeShaderSafeTexture(source, new File(outputRoot,
                    "assets/antiqueatlas/textures/gui/shader_safe/tiles/${source.name}"), true)
        }
        writeShaderSafeTexture(frameSource, new File(outputRoot,
                'assets/antiqueatlas/textures/gui/shader_safe/book_frame.png'), false)
        logger.lifecycle("Generated ${tileSources.files.size() + 1} shader-safe atlas textures")
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn(generateShaderSafeTextures)
    from(generatedShaderSafeResources)

    var replaceProperties = [
            minecraft_version: _minecraft_version,
            minecraft_version_min: _minecraft_version_min, minecraft_version_max: _minecraft_version_max,
            loader_version_min: _loader_version_min, loader_version_max: _loader_version_max,
            mod_page: _mod_page, mod_version: _mod_version, mod_issue_tracker: _mod_issue_tracker,
            mod_name: _mod_name, mod_license: _mod_license, mod_id: _mod_id,
            mod_authors: _mod_authors, mod_description: _mod_description, loader_file: _loader_file,
    ]
    inputs.properties replaceProperties
    filesMatching([_loader_file, 'pack.mcmeta']) {
        expand replaceProperties// + [project: project]
    }
}

publishing {
	publications {
        mavenJava(MavenPublication) {
			afterEvaluate {
                artifact project._mod_jar
            }
        
        	groupId = project.group
			artifactId = project.archivesBaseName
			version = project.version
        }
    }
    repositories {
        maven {
            name = "modmaven"
			credentials {
				username "$System.env.ARTIFACTORYUSER"
				password "$System.env.ARTIFACTORYPASS"
			}
			url = "https://modmaven.dev/artifactory/local-releases/"
        }
    }
}

publishMods {
    curseforge {
        projectId = "${_curseforge_id}"
        accessToken = "$System.env.CURSEFORGEKEY"
        changelog = file('changelog.md').text
        changelogType = "markdown"
        if ("${_mod_release}" == "release") type = STABLE
        if ("${_mod_release}" == "beta") type = BETA
        if ("${_mod_release}" == "alpha") type = ALPHA
        minecraftVersions.add("${_minecraft_version}")
        modLoaders.add("${_loader}")
        file = project._mod_jar.archiveFile
        displayName = _mod_name+"-$project.version"
		/*mainArtifact(project._mod_jar) {
			displayName = _mod_name+"-$project.version"
		}*/
 
        if ("${_mod_environment}".contains('client')) clientRequired = true
        if ("${_mod_environment}".contains('server')) serverRequired = true
    }
}

modrinth {
    projectId = "${_modrinth_id}"
    token = "$System.env.MODRINTH_TOKEN"
    versionNumber = "${project.version}"
    versionType = "${_mod_release}"
    uploadFile = project._mod_jar
    gameVersions = ["${_minecraft_version}"]
    loaders = ["${_loader}".toLowerCase()]
	changelog = file('changelog.md').text
}

task uploadToAllSites {
    dependsOn "publishCurseforge"
    dependsOn "modrinth"
    group = "publishing"
}

task uploadToAllSitesAndMaven {
    dependsOn "publish"
    dependsOn "uploadToAllSites"
    group = "publishing"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
